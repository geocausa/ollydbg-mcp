name: Apply mutation gate support

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-mutation-gate-support-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'native-mutation-gate-v10'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=10 origin native-mutation-gate-v10
          git checkout -q -B native-mutation-gate-v10 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact support transformations
        run: python tools/apply_mutation_gate_support.py
      - name: Commit transformed support files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Mutation-gate support is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ollydbg_mcp/client.py ollydbg_mcp/smoke.py tests/test_native_source.py tests/test_runtime_harness.py tests/test_smoke.py
          git commit -m "Integrate the native mutation gate"
          git pull --rebase origin native-mutation-gate-v10
          git push origin HEAD:native-mutation-gate-v10
