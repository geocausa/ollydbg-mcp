name: Apply native correctness fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-native-correctness-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'native-correctness-v11'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=10 origin native-correctness-v11
          git checkout -q -B native-correctness-v11 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact native source transformations
        run: python tools/apply_native_correctness.py
      - name: Commit transformed source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Native correctness fixes are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_stub/ollydbg110_bridge.c
          git commit -m "Harden native values and hardware breakpoints"
          git pull --rebase origin native-correctness-v11
          git push origin HEAD:native-correctness-v11
