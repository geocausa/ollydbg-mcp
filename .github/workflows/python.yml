name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact commit
        shell: bash
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.22"
          args: "check ."

  native-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile bounded JSON parser harness
        run: cc -std=c89 -pedantic -Wall -Wextra -Werror tests/native_json_harness.c -o native_json_harness
      - name: Run bounded JSON parser harness
        run: ./native_json_harness

  native-dll:
    runs-on: windows-latest
    steps:
      - name: Fetch exact commit quietly
        shell: powershell
        run: |
          git init -q
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin $env:GITHUB_SHA
          git checkout -q FETCH_HEAD
      - name: Compile, link and inspect the 32-bit DLL
        shell: cmd
        run: |
          @echo off
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86 >nul
          powershell -NoProfile -ExecutionPolicy Bypass -File .\plugin_stub\build_plugin.ps1 -SdkDir .\tests\ollydbg_sdk_stub -OutputDir .\build\native-ci -AllowTestSdk
      - name: Remove the test-only DLL
        if: always()
        shell: powershell
        run: Remove-Item .\build\native-ci -Recurse -Force -ErrorAction SilentlyContinue

  runtime-target:
    runs-on: windows-latest
    steps:
      - name: Fetch exact commit quietly
        shell: powershell
        run: |
          git init -q
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin $env:GITHUB_SHA
          git checkout -q FETCH_HEAD
      - name: Parse runtime PowerShell entry points
        shell: powershell
        run: |
          $files = @(
            '.\plugin_stub\build_plugin.ps1',
            '.\integration\build_smoke_target.ps1',
            '.\integration\run_runtime_smoke.ps1',
            '.\start_olly_bridge.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              throw "PowerShell syntax validation failed: $file"
            }
          }
      - name: Compile and inspect the controlled x86 smoke target
        shell: cmd
        run: |
          @echo off
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio C++ tools were not found.
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86 >nul
          powershell -NoProfile -ExecutionPolicy Bypass -File .\integration\build_smoke_target.ps1 -OutputDir .\build\runtime-target-ci
      - name: Validate the generated address manifest
        shell: powershell
        run: |
          $manifest = Get-Content .\build\runtime-target-ci\olly_smoke_manifest.json -Raw | ConvertFrom-Json
          if ($manifest.schema_version -ne 1) { throw "Unexpected manifest schema" }
          if ($manifest.module_name -ne "olly_smoke_target.exe") { throw "Unexpected target module" }
          if ($manifest.image_base -ne "0x00400000") { throw "Unexpected image base" }
          if ($manifest.probe_address -notmatch '^0x004[0-9A-F]{5}$') { throw "Invalid probe address" }
          if ($manifest.counter_address -notmatch '^0x004[0-9A-F]{5}$') { throw "Invalid counter address" }
      - name: Remove the test-only smoke target
        if: always()
        shell: powershell
        run: Remove-Item .\build\runtime-target-ci -Recurse -Force -ErrorAction SilentlyContinue

  named-pipe:
    runs-on: windows-latest
    steps:
      - name: Fetch exact commit quietly
        shell: powershell
        run: |
          git init -q
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin $env:GITHUB_SHA
          git checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies quietly
        run: python -m pip install -q -e ".[dev]"
      - name: Run real Windows named-pipe tests
        run: python -m pytest -vv tests/test_named_pipe_windows.py

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --ignore=tests/test_named_pipe_windows.py
