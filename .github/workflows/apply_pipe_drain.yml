name: Apply pipe drain fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-pipe-drain-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'named-pipe-integration-v8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Apply exact source transformations
        run: python tools/apply_pipe_drain.py
      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Pipe drain fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_stub/ollydbg110_bridge.c tests/test_named_pipe_windows.py tests/test_native_source.py README.md
          git commit -m "Wait for named-pipe clients to drain responses"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
