name: Apply UI-thread hardening

on:
  push:
    branches: [ui-thread-hardening-v3]
    paths:
      - tools/apply_ui_thread.py
      - .github/workflows/apply-ui-thread.yml
  pull_request:
    branches: [main]
    paths:
      - tools/apply_ui_thread.py
      - .github/workflows/apply-ui-thread.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: ui-thread-hardening-v3-generator
      cancel-in-progress: false
    steps:
      - name: Fetch working branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin ui-thread-hardening-v3
          git checkout -q -B ui-thread-hardening-v3 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply checked transformation
        shell: bash
        run: |
          set -euo pipefail
          source_file=plugin_stub/ollydbg110_bridge.c
          if grep -q 'static int execute_request_on_ui_thread(' "$source_file"; then
            echo "UI-thread marshalling already applied"
          else
            python tools/apply_ui_thread.py
          fi
          git diff --check
      - name: Commit generated source when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated source is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_stub/ollydbg110_bridge.c
          git commit -m "Marshal bridge requests through the OllyDbg UI thread"
          for attempt in 1 2 3; do
            git fetch -q origin ui-thread-hardening-v3
            git rebase origin/ui-thread-hardening-v3
            if git push origin HEAD:ui-thread-hardening-v3; then
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/3)"
            sleep $((attempt * 2))
          done
          exit 1
