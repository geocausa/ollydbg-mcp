name: Diagnose mutation gate

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'native-mutation-gate-v10'
    runs-on: windows-latest
    steps:
      - name: Fetch exact commit quietly
        shell: powershell
        run: |
          git init -q
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin $env:GITHUB_SHA
          git checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e ".[dev]"
      - run: python -m pytest -vv -x --tb=short tests/test_smoke.py tests/test_native_source.py tests/test_runtime_harness.py
