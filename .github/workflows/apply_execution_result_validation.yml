name: Apply execution result validation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-execution-result-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'execution-result-validation-v12'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=10 origin execution-result-validation-v12
          git checkout -q -B execution-result-validation-v12 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact execution transformations
        run: python tools/apply_execution_result_validation.py
      - name: Commit transformed files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Execution result validation is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ollydbg_mcp/client.py ollydbg_mcp/smoke.py plugin_stub/ollydbg110_bridge.c tests/test_native_source.py tests/test_smoke.py
          git commit -m "Validate native step and continue results"
          git pull --rebase origin execution-result-validation-v12
          git push origin HEAD:execution-result-validation-v12
