name: Apply native hardening

on:
  push:
    branches: [native-hardening-v2]
    paths:
      - tools/native_patch_protocol.py
      - tools/native_patch_pipe.py
      - .github/workflows/apply-native-hardening.yml
  pull_request:
    branches: [main]
    paths:
      - tools/native_patch_protocol.py
      - tools/native_patch_pipe.py
      - .github/workflows/apply-native-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch working branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin native-hardening-v2
          git checkout -q -B native-hardening-v2 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply checked source transformations
        shell: bash
        run: |
          set +e
          python tools/native_patch_protocol.py >native-patch.log 2>&1
          status=$?
          if [ $status -eq 0 ]; then
            python tools/native_patch_pipe.py >>native-patch.log 2>&1
            status=$?
          fi
          cat native-patch.log
          exit $status
      - name: Validate and commit generated native source
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No native source changes were produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_stub/ollydbg110_bridge.c
          git commit -m "Harden native pipe and pause protocol"
          git push origin HEAD:native-hardening-v2
