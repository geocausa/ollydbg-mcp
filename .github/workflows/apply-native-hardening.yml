name: Apply native hardening

on:
  push:
    branches: [native-hardening-v2]
    paths:
      - tools/native_patch_protocol.py
      - tools/native_patch_pipe.py
      - tools/native_patch_buffers.py
      - .github/workflows/apply-native-hardening.yml
  pull_request:
    branches: [main]
    paths:
      - tools/native_patch_protocol.py
      - tools/native_patch_pipe.py
      - tools/native_patch_buffers.py
      - .github/workflows/apply-native-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch working branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin native-hardening-v2
          git checkout -q -B native-hardening-v2 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply checked source transformations
        shell: bash
        run: |
          set -euo pipefail
          source_file=plugin_stub/ollydbg110_bridge.c
          if grep -q '#define BRIDGE_PROTOCOL_VERSION 2' "$source_file"; then
            echo "Protocol and pipe hardening already applied"
          else
            python tools/native_patch_protocol.py
            python tools/native_patch_pipe.py
          fi
          if grep -q 'static int append_format(' "$source_file"; then
            echo "Bounded response builder already applied"
          else
            python tools/native_patch_buffers.py
          fi
          git diff --check
      - name: Commit generated native source when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Native source is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_stub/ollydbg110_bridge.c
          git commit -m "Bound native bridge response construction"
          git push origin HEAD:native-hardening-v2
