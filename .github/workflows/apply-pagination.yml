name: Apply table pagination

on:
  push:
    branches: [pagination-hardening-v5]
    paths:
      - tools/apply_native_pagination.py
      - tools/apply_python_pagination.py
      - .github/workflows/apply-pagination.yml
  pull_request:
    branches: [main]
    paths:
      - tools/apply_native_pagination.py
      - tools/apply_python_pagination.py
      - .github/workflows/apply-pagination.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: pagination-hardening-v5-generator
      cancel-in-progress: false
    steps:
      - name: Fetch working branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin pagination-hardening-v5
          git checkout -q -B pagination-hardening-v5 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply checked pagination transformations
        shell: bash
        run: |
          set -euo pipefail
          native_file=plugin_stub/ollydbg110_bridge.c
          client_file=ollydbg_mcp/client.py
          if grep -q '#define MODULE_PAGE_LIMIT 8' "$native_file"; then
            echo "Native table pagination already applied"
          else
            python tools/apply_native_pagination.py
          fi
          if grep -q 'def _collect_table_pages(' "$client_file"; then
            echo "Python pagination collector already applied"
          else
            python tools/apply_python_pagination.py
          fi
          git diff --check
      - name: Commit generated changes when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated pagination changes are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_stub/ollydbg110_bridge.c ollydbg_mcp/client.py
          git commit -m "Page native debugger tables transparently"
          for attempt in 1 2 3; do
            git fetch -q origin pagination-hardening-v5
            git rebase origin/pagination-hardening-v5
            if git push origin HEAD:pagination-hardening-v5; then
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/3)"
            sleep $((attempt * 2))
          done
          exit 1
