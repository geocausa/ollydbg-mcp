name: Apply native mutation gate

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-native-mutation-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'native-mutation-gate-v10'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch quietly
        shell: bash
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=10 origin native-mutation-gate-v10
          git checkout -q -B native-mutation-gate-v10 FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact native mutation-gate transformation
        run: python tools/apply_mutation_gate.py
      - name: Commit transformed source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Native mutation gate is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_stub/ollydbg110_bridge.c
          git commit -m "Add a native read-only mutation gate"
          git pull --rebase origin native-mutation-gate-v10
          git push origin HEAD:native-mutation-gate-v10
