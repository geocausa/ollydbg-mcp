name: Diagnose audit tests

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'audit-fixes-v13'
    runs-on: windows-latest
    steps:
      - name: Fetch exact commit quietly
        shell: powershell
        run: |
          git init -q
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin $env:GITHUB_SHA
          git checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e ".[dev]"
      - run: python -m pytest -x -vv --tb=short --ignore=tests/test_named_pipe_windows.py
